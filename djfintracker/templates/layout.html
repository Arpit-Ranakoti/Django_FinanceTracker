{% load static tailwind_tags %}
{%load static%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} home {% endblock %}</title>
    <link rel="stylesheet" href="{%static 'style.css'%}">
     {% tailwind_css %}
</head>
<body class="bg-gray-100">
    <nav class="bg-indigo-500 p-4 text-white">
        {% if user.is_authenticated %}
        <form id="logout-form" action="{%url 'logout'%}" method="POST" style="display:inline;">
             {% csrf_token %}
            <a href="{%url 'dashboard'%}" class="mx-4">Dashboard</a>
                <a href="{%url 'transaction_add'%}" class="mx-4">Add Transaction</a>
                <a href="{%url 'transaction_list'%}" class="mx-4">Transaction_list</a>
                <a href="{%url 'goal_add'%}" class="mx-4">Add Goal</a>
                <a href="#" onclick="document.getElementById('logout-form').submit();" class="ml-4">
                    logout
                </a>
            </form>
        {% else %}
        <a href="{%url 'login'%}" class="ml-4">Login</a>
        <a href="{%url 'register'%}" class="ml-4">Register</a>
        {% endif %}
    </nav>
    {% block content %}
    {% endblock %}
</body>
</html>
